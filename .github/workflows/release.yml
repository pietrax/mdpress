name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: brew install pandoc typst
      - name: Tag matches the package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci && npm test
      - run: ./scripts/package.sh
      - run: ./scripts/smoke-tarball.sh release/mdpress-*.tar.gz
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.tar.gz --generate-notes
      - name: Open the PR on the tap
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: ./scripts/update-tap.sh "${GITHUB_REF_NAME#v}" release/mdpress-*.tar.gz
